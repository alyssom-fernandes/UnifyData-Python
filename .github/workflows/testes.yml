name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Só o que o núcleo usa: a interface (Streamlit) não entra nos testes
      - run: pip install pandas openpyxl xlrd thefuzz
      - run: python -m unittest discover -s tests -v
