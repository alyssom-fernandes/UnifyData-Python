name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # O README promete Python 3.10 ou mais novo
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # As mesmas versões do requirements.txt: o teste da tela usa o Streamlit
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      # A tela também precisa compilar em todas as versões
      - run: python -m py_compile unifydata.py nucleo.py
