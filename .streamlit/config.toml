[server]
# Só este computador acessa o app (por padrão o Streamlit também atende a rede local)
address = "localhost"
# Serve a pasta static/ (só as fontes): nada é buscado no Google Fonts
enableStaticServing = true

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
font = "Instrument Sans, sans-serif"
codeFont = "JetBrains Mono, monospace"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontSize = "26px"
metricValueFontWeight = 600

# Fontes hospedadas no projeto (static/fonts, SIL OFL 1.1)
[[theme.fontFaces]]
family = "Instrument Sans"
url = "app/static/fonts/instrument-sans.woff2"
weight = "400 700"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono.woff2"
weight = "400 700"

[theme.light]
primaryColor = "#18181b"
backgroundColor = "#f6f6f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#18181b"
borderColor = "#d1d1d8"
linkColor = "#0d6e66"

[theme.light.sidebar]
backgroundColor = "#fafafb"
secondaryBackgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#ededef"
backgroundColor = "#141416"
secondaryBackgroundColor = "#1a1a1d"
textColor = "#ededef"
borderColor = "#3a3a42"
linkColor = "#3fcfb9"

[theme.dark.sidebar]
backgroundColor = "#18181b"
secondaryBackgroundColor = "#1a1a1d"
